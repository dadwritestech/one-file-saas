<!doctype html>
<!--
  one-file-saas · Pages
  Replaces: a Notion-like notes workspace (Notion Plus, ~$120/yr)
  Nested pages in a sidebar tree, a block editor with Markdown shortcuts (# ## ### - 1. [] > ``` --- !)
  and a "/" command menu, to-dos, callouts, code, sub-page links, Ctrl+B/I/E inline styles,
  drag to reorder blocks, Ctrl+K quick switcher with full-text search, Markdown export.
  Rich text is stored as HTML and passed through a whitelist sanitizer on every render.
  Data: localStorage key "ofs.notes.v1". Export/Import JSON in the ⋯ menu. No network requests. MIT.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pages · one-file-saas</title>
<style>
  :root {
    --bg: #ffffff; --side: #f7f6f3; --ink: #37352f; --ink-2: #787570; --ink-3: #aeaba5; --line: #ebeae6; --hover: #efeee9; --sel: #e7f0fb;
    --accent: #2e7dd7; --code: #f6f5f2; --callout: #f8f5ec;
    --sans: "Segoe UI Variable Text", "Segoe UI", -apple-system, "Helvetica Neue", sans-serif;
    --serif: "Sitka Display", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    --mono: ui-monospace, "Cascadia Code", "SF Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #191919; --side: #202020; --ink: #e6e5e2; --ink-2: #a19f9a; --ink-3: #6b6964; --line: #2f2f2f; --hover: #2c2c2c; --sel: #20344a; --code: #252525; --callout: #26241f; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 var(--sans); display: grid; grid-template-columns: 260px minmax(0, 1fr); }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .hidden { display: none !important; }
  aside { background: var(--side); border-right: 1px solid var(--line); height: 100vh; position: sticky; top: 0; display: flex; flex-direction: column; font-size: 14px; }
  .ws { display: flex; align-items: center; gap: 8px; padding: 14px 14px 10px; font-weight: 650; }
  .ws i { width: 22px; height: 22px; border-radius: 6px; background: var(--ink); color: var(--bg); display: grid; place-items: center; font: 700 13px var(--serif); font-style: normal; }
  .sbtn { display: flex; align-items: center; gap: 8px; width: calc(100% - 12px); margin: 0 6px; border: 0; background: none; padding: 5px 8px; border-radius: 6px; color: var(--ink-2); text-align: left; }
  .sbtn:hover { background: var(--hover); }
  .sbtn kbd { margin-left: auto; font: 11px var(--mono); color: var(--ink-3); }
  .tree { flex: 1; overflow: auto; padding: 10px 6px; }
  .tree .lbl { font-size: 11.5px; font-weight: 650; color: var(--ink-3); padding: 4px 8px; }
  .node { display: flex; align-items: center; gap: 2px; border-radius: 6px; padding: 2px 4px; cursor: pointer; color: var(--ink-2); position: relative; }
  .node:hover { background: var(--hover); }
  .node.on { background: var(--hover); color: var(--ink); font-weight: 600; }
  .node .tw { width: 20px; height: 20px; border: 0; background: none; border-radius: 4px; color: var(--ink-3); font-size: 10px; padding: 0; flex: none; }
  .node .tw:hover { background: var(--line); }
  .node .ic { width: 22px; text-align: center; flex: none; }
  .node .nm { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 2px 0; }
  .node .act { display: none; gap: 1px; }
  .node:hover .act { display: flex; }
  .node .act button { border: 0; background: none; width: 22px; height: 22px; border-radius: 4px; color: var(--ink-2); padding: 0; }
  .node .act button:hover { background: var(--line); }
  .sfoot { padding: 8px 6px 12px; border-top: 1px solid var(--line); }

  main { min-width: 0; }
  .top { position: sticky; top: 0; z-index: 3; background: var(--bg); display: flex; align-items: center; gap: 6px; padding: 8px 14px; font-size: 14px; color: var(--ink-2); }
  .crumbs { display: flex; align-items: center; gap: 2px; min-width: 0; flex: 1; overflow: hidden; }
  .crumbs button { border: 0; background: none; padding: 2px 6px; border-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
  .crumbs button:hover { background: var(--hover); }
  .ghost { border: 0; background: none; padding: 4px 8px; border-radius: 6px; color: var(--ink-2); }
  .ghost:hover { background: var(--hover); }
  .menu { position: absolute; right: 14px; top: 40px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 12px 34px rgba(0,0,0,.14); padding: 5px; display: grid; min-width: 200px; z-index: 9; }
  .menu button { border: 0; background: none; text-align: left; padding: 6px 10px; border-radius: 6px; font-size: 14px; }
  .menu button:hover { background: var(--hover); }
  .menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; width: 100%; }
  .doc { max-width: 740px; margin: 0 auto; padding: 60px 56px 40vh; }
  .icon { font-size: 54px; line-height: 1; border: 0; background: none; padding: 4px; border-radius: 8px; margin-left: -4px; }
  .icon:hover { background: var(--hover); }
  .addIcon { border: 0; background: none; color: var(--ink-3); font-size: 14px; padding: 4px 6px; border-radius: 6px; }
  .addIcon:hover { background: var(--hover); }
  h1.title { font: 700 40px/1.2 var(--serif); letter-spacing: -.01em; margin: 6px 0 18px; outline: none; }
  h1.title:empty::before { content: 'Untitled'; color: var(--ink-3); }
  .emojis { position: absolute; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 12px 34px rgba(0,0,0,.14); padding: 8px; display: grid; grid-template-columns: repeat(8, 34px); gap: 2px; z-index: 9; }
  .emojis button { border: 0; background: none; font-size: 20px; border-radius: 6px; height: 34px; padding: 0; }
  .emojis button:hover { background: var(--hover); }
  .emojis .rm { grid-column: 1 / -1; font-size: 13px; color: var(--ink-2); }

  .block { position: relative; display: flex; align-items: flex-start; gap: 4px; margin: 1px 0; border-radius: 4px; }
  .block .hd { position: absolute; left: -48px; top: 3px; display: flex; opacity: 0; transition: opacity .1s; }
  .block:hover .hd { opacity: 1; }
  .hd button { border: 0; background: none; color: var(--ink-3); width: 22px; height: 24px; border-radius: 4px; padding: 0; font-size: 15px; line-height: 1; }
  .hd button:hover { background: var(--hover); }
  .hd .grip { cursor: grab; letter-spacing: -2px; }
  .block.drop-above { box-shadow: 0 -3px 0 #8fbdf0; }
  .block.drop-below { box-shadow: 0 3px 0 #8fbdf0; }
  .c { flex: 1; min-width: 0; outline: none; padding: 3px 2px; white-space: pre-wrap; word-break: break-word; }
  .c:empty::before { content: attr(data-ph); color: var(--ink-3); pointer-events: none; }
  .c:not(:focus):empty::before { content: ''; }
  .t-h1 .c, .t-h1 .c:empty::before { font: 700 30px/1.3 var(--serif); }
  .t-h2 .c { font: 650 24px/1.3 var(--serif); }
  .t-h3 .c { font: 650 19px/1.4 var(--sans); }
  .t-h1 { margin-top: 22px; } .t-h2 { margin-top: 16px; } .t-h3 { margin-top: 10px; }
  .mark { width: 24px; flex: none; text-align: center; padding-top: 3px; color: var(--ink); user-select: none; }
  .t-ul .mark { font-size: 22px; line-height: 1.15; }
  .t-ol .mark { font-variant-numeric: tabular-nums; }
  .t-todo .mark input { width: 16px; height: 16px; margin: 6px 0 0; accent-color: var(--accent); cursor: pointer; }
  .t-todo.done .c { text-decoration: line-through; color: var(--ink-3); }
  .t-quote .c { border-left: 3px solid var(--ink); padding-left: 14px; font-size: 17px; }
  .t-callout { background: var(--callout); border-radius: 6px; padding: 12px 14px 12px 10px; margin: 6px 0; }
  .t-callout .mark { font-size: 20px; padding-top: 0; }
  .t-code .c { font: 13.5px/1.6 var(--mono); background: var(--code); border-radius: 6px; padding: 14px 16px; tab-size: 2; }
  .t-divider { padding: 10px 0; cursor: default; }
  .t-divider hr { flex: 1; border: 0; border-top: 1px solid var(--line); margin: 0; }
  .t-page a { flex: 1; display: flex; align-items: center; gap: 8px; color: var(--ink); text-decoration: none; padding: 3px 2px; border-radius: 4px; font-weight: 600; }
  .t-page a span:last-child { border-bottom: 1px solid var(--ink-3); }
  .t-page a:hover { background: var(--hover); }
  .c code, .c .ic { font: .86em var(--mono); background: var(--code); color: #eb5757; padding: 1px 5px; border-radius: 4px; }
  .c a { color: inherit; text-decoration: underline; text-decoration-color: var(--ink-3); }
  .tail { min-height: 120px; cursor: text; }
  .meta { color: var(--ink-3); font-size: 12.5px; margin-top: 30px; }

  .slash { position: absolute; z-index: 9; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 12px 34px rgba(0,0,0,.16); width: 280px; max-height: 340px; overflow: auto; padding: 5px; font-size: 14px; }
  .slash .hdr { font-size: 11.5px; color: var(--ink-3); padding: 4px 8px; }
  .slash button { display: flex; gap: 10px; align-items: center; width: 100%; border: 0; background: none; padding: 5px 8px; border-radius: 6px; text-align: left; }
  .slash button.on { background: var(--hover); }
  .slash .gl { width: 34px; height: 34px; border: 1px solid var(--line); border-radius: 6px; display: grid; place-items: center; background: var(--bg); font-weight: 700; flex: none; }
  .slash small { display: block; color: var(--ink-3); font-size: 12px; }

  dialog { border: 0; border-radius: 12px; padding: 0; width: min(560px, 92vw); background: var(--bg); color: var(--ink); box-shadow: 0 30px 80px rgba(0,0,0,.3); margin-top: 14vh; }
  dialog::backdrop { background: rgba(15, 15, 15, .35); }
  #qIn { width: 100%; border: 0; border-bottom: 1px solid var(--line); padding: 14px 18px; font-size: 17px; outline: none; background: none; }
  #qRes { max-height: 50vh; overflow: auto; padding: 6px; }
  #qRes button { display: block; width: 100%; border: 0; background: none; text-align: left; padding: 8px 12px; border-radius: 6px; }
  #qRes button.on { background: var(--hover); }
  #qRes small { display: block; color: var(--ink-3); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .toast { position: fixed; bottom: 22px; left: 50%; transform: translate(-50%, 80px); opacity: 0; background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 8px; transition: .25s; z-index: 20; font-size: 14px; }
  .toast.show { transform: translate(-50%, 0); opacity: 1; }
  @media (max-width: 820px) { body { grid-template-columns: 1fr; } aside { display: none; } .doc { padding: 30px 22px 40vh; } .block .hd { display: none; } }
</style>
</head>
<body>
<aside>
  <div class="ws"><i>P</i>My workspace</div>
  <button class="sbtn" id="search">⌕ Search<kbd>Ctrl K</kbd></button>
  <div class="tree"><div class="lbl">Pages</div><div id="tree"></div></div>
  <div class="sfoot"><button class="sbtn" id="newRoot">+ New page</button></div>
</aside>
<main>
  <div class="top">
    <div class="crumbs" id="crumbs"></div>
    <span id="saved" style="font-size:12.5px;color:var(--ink-3)"></span>
    <button class="ghost" id="menuBtn" aria-label="Page menu">⋯</button>
    <div class="menu hidden" id="menu">
      <button id="mMd">Export page as Markdown</button>
      <button id="mDup">Duplicate page</button>
      <button id="mDel">Delete page</button>
      <hr>
      <button id="mExp">Export JSON (everything)</button>
      <button id="mImp">Import JSON</button>
    </div>
    <input type="file" id="impFile" accept=".json" class="hidden">
  </div>
  <div class="doc" id="doc"></div>
</main>
<dialog id="qDlg"><input id="qIn" placeholder="Search pages…" aria-label="Search pages"><div id="qRes"></div></dialog>
<div class="toast" id="toast" role="status"></div>

<script>
'use strict';
const KEY = 'ofs.notes.v1';
const $ = (s, el = document) => el.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 10);
function h(tag, props = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') el.className = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, '');
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(kid));
  return el;
}
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 1800); }

/* ---------- sanitizer: the only door for stored HTML ---------- */
const ALLOWED = { B: 'b', STRONG: 'b', I: 'i', EM: 'i', U: 'u', S: 's', STRIKE: 's', CODE: 'code', BR: 'br', A: 'a' };
function sanitize(html) {
  const tpl = document.createElement('template'); tpl.innerHTML = String(html || ''); // inert: nothing runs or loads here
  const out = document.createElement('div');
  (function walk(src, dst) {
    for (const n of src.childNodes) {
      if (n.nodeType === 3) { dst.append(n.textContent); continue; }
      if (n.nodeType !== 1) continue;
      const tag = ALLOWED[n.tagName];
      if (!tag) { if (!/^(SCRIPT|STYLE|TEMPLATE|IFRAME|OBJECT)$/.test(n.tagName)) walk(n, dst); continue; }
      const el = document.createElement(tag);
      if (tag === 'a') { const href = n.getAttribute('href') || ''; if (/^(https?:|mailto:)/i.test(href)) { el.href = href; el.target = '_blank'; el.rel = 'noopener'; } }
      dst.append(el); walk(n, el);
    }
  })(tpl.content, out);
  return out.innerHTML;
}
const textOf = (html) => { const t = document.createElement('template'); t.innerHTML = html || ''; return t.content.textContent; };

/* ---------- data ---------- */
const B = (type, html = '', extra = {}) => ({ id: uid(), type, html, ...extra });
function seed() {
  const now = Date.now();
  const P = (title, icon, blocks, parent = null) => ({ id: uid(), title, icon, parent, children: [], blocks, open: true, updated: now });
  const start = P('Getting started', '👋', [
    B('callout', 'This whole workspace is <b>one HTML file</b>. Your pages live in this browser. Use <b>⋯ → Export</b> for a backup.', { emoji: '💡' }),
    B('h2', 'Write like Markdown'),
    B('ul', 'Type <code>#</code>, <code>##</code> or <code>###</code> and a space for headings'),
    B('ul', '<code>-</code> for bullets, <code>1.</code> for numbers, <code>[]</code> for a to-do, <code>&gt;</code> for a quote'),
    B('ul', '<code>```</code> for code, <code>---</code> for a divider, <code>!</code> for a callout'),
    B('h2', 'Or press /'),
    B('p', 'Type <b>/</b> on an empty line to pick any block, including a <i>sub-page</i>.'),
    B('todo', 'Try ticking this box', { checked: true }),
    B('todo', 'Drag the ⋮⋮ handle to reorder blocks'),
    B('todo', 'Press Ctrl+K to jump between pages'),
    B('divider'),
    B('quote', 'Simple things should be simple, complex things should be possible.'),
  ]);
  const proj = P('Project Atlas', '🗺️', [B('p', 'Rebuild the onboarding flow. Ship by end of quarter.'), B('h3', 'Milestones'),
    B('ol', 'Research interviews'), B('ol', 'Prototype'), B('ol', 'Beta with 20 customers')]);
  const meet = P('Weekly sync', '🗓️', [B('h3', 'Notes'), B('ul', 'Signup drop-off is at the email step'), B('ul', 'Try magic links'),
    B('h3', 'Action items'), B('todo', 'Draft the email copy', { checked: true }), B('todo', 'Ask design for two variants')], proj.id);
  const code = P('Snippets', '🧩', [B('p', 'Handy bits:'), B('code', 'git log --oneline --graph --all\ngit switch -c feature/x')], proj.id);
  proj.children = [meet.id, code.id];
  proj.blocks.push(B('page', '', { page: meet.id }), B('page', '', { page: code.id }));
  const read = P('Reading list', '📚', [B('todo', 'The Design of Everyday Things', { checked: true }), B('todo', 'Shape Up'), B('todo', 'A Philosophy of Software Design')]);
  const pages = Object.fromEntries([start, proj, meet, code, read].map((p) => [p.id, p]));
  return { pages, roots: [start.id, proj.id, read.id], cur: start.id };
}
function load() { try { return JSON.parse(localStorage.getItem(KEY)); } catch { return null; } }
let state = load() || seed();
if (!localStorage.getItem(KEY)) localStorage.setItem(KEY, JSON.stringify(state)); // pin seeded ids so share links stay valid
let saveT = 0;
function save(now) {
  clearTimeout(saveT);
  const go = () => { saveT = 0; localStorage.setItem(KEY, JSON.stringify(state)); $('#saved').textContent = 'Saved'; };
  if (now) go(); else { $('#saved').textContent = '…'; saveT = setTimeout(go, 250); }
}
const page = () => state.pages[state.cur];
const touch = () => { page().updated = Date.now(); };
function ancestors(p) { const a = []; while (p?.parent) { p = state.pages[p.parent]; if (p) a.unshift(p); } return a; }

/* ---------- sidebar ---------- */
function drawTree() {
  const row = (id, depth) => {
    const p = state.pages[id]; if (!p) return [];
    const node = h('div', { class: 'node' + (id === state.cur ? ' on' : ''), style: `padding-left:${4 + depth * 14}px`, onclick: () => go(id), 'data-page': id },
      h('button', { class: 'tw', 'aria-label': p.open ? 'Collapse' : 'Expand', style: p.children.length ? '' : 'visibility:hidden', onclick: (e) => { e.stopPropagation(); p.open = !p.open; save(); drawTree(); } }, p.open ? '▼' : '▶'),
      h('span', { class: 'ic' }, p.icon || '📄'), h('span', { class: 'nm' }, p.title || 'Untitled'),
      h('span', { class: 'act' }, h('button', { title: 'Add a page inside', 'aria-label': 'Add sub-page to ' + (p.title || 'Untitled'), onclick: (e) => { e.stopPropagation(); newPage(id); } }, '+')));
    return [node, ...(p.open ? p.children.flatMap((c) => row(c, depth + 1)) : [])];
  };
  $('#tree').replaceChildren(...state.roots.flatMap((id) => row(id, 0)));
}
function newPage(parent = null, title = '') {
  const p = { id: uid(), title, icon: '', parent, children: [], blocks: [B('p')], open: true, updated: Date.now() };
  state.pages[p.id] = p;
  if (parent) { state.pages[parent].children.push(p.id); state.pages[parent].open = true; } else state.roots.push(p.id);
  go(p.id); setTimeout(() => $('h1.title').focus());
  return p;
}
function go(id) { if (!state.pages[id]) return; state.cur = id; save(true); drawTree(); drawPage(); }

/* ---------- page ---------- */
const ICONS = ['📄', '📝', '📚', '🗺️', '🗓️', '💡', '✅', '🚀', '🎯', '🧩', '📌', '🔖', '🏠', '💼', '🎨', '🧪', '🌱', '⭐', '🔥', '🧠', '🛠️', '✈️', '🍳', '❤️'];
function drawCrumbs() {
  const p = page();
  $('#crumbs').replaceChildren(...[...ancestors(p), p].flatMap((a, i) => [i ? h('span', {}, '/') : null, h('button', { onclick: () => go(a.id) }, `${a.icon || '📄'} ${a.title || 'Untitled'}`)]).filter(Boolean));
}
function drawPage() {
  const p = page(); if (!p) { state.cur = state.roots[0]; if (!page()) return; return drawPage(); }
  closeSlash(); drawCrumbs();
  const title = h('h1', { class: 'title', contenteditable: 'plaintext-only', spellcheck: 'true', 'aria-label': 'Page title' }, p.title);
  title.addEventListener('input', () => { p.title = title.textContent; touch(); save(); drawTree(); drawCrumbs(); document.title = (p.title || 'Untitled') + ' · Pages'; });
  title.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); if (!p.blocks.length) p.blocks.push(B('p')); drawBlocks(); focusBlock(0, 0); } });
  const iconBtn = p.icon ? h('button', { class: 'icon', 'aria-label': 'Change icon', onclick: (e) => pickIcon(e.currentTarget) }, p.icon)
    : h('button', { class: 'addIcon', onclick: (e) => pickIcon(e.currentTarget) }, '☺ Add icon');
  $('#doc').replaceChildren(iconBtn, title, h('div', { id: 'blocks' }),
    h('div', { class: 'tail', onclick: () => { const last = p.blocks.at(-1); if (!last || last.type !== 'p' || textOf(last.html)) { p.blocks.push(B('p')); drawBlocks(); } focusBlock(p.blocks.length - 1); } }),
    h('div', { class: 'meta', id: 'meta' }));
  document.title = (p.title || 'Untitled') + ' · Pages';
  drawBlocks();
}
function drawMeta() {
  const p = page(); const words = p.blocks.reduce((n, b) => n + (textOf(b.html).match(/\S+/g) || []).length, 0);
  $('#meta').textContent = `${words} words · edited ${new Date(p.updated).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' })}`;
}
function pickIcon(anchor) {
  const r = anchor.getBoundingClientRect();
  const box = h('div', { class: 'emojis', style: `left:${r.left + scrollX}px;top:${r.bottom + scrollY + 4}px` },
    ICONS.map((e) => h('button', { onclick: () => { page().icon = e; touch(); save(); box.remove(); drawPage(); drawTree(); } }, e)),
    h('button', { class: 'rm', onclick: () => { page().icon = ''; save(); box.remove(); drawPage(); drawTree(); } }, 'Remove icon'));
  document.body.append(box);
  setTimeout(() => document.addEventListener('click', function off(e) { if (!box.contains(e.target)) { box.remove(); document.removeEventListener('click', off); } }));
}

const PH = { p: "Type '/' for commands", h1: 'Heading 1', h2: 'Heading 2', h3: 'Heading 3', ul: 'List', ol: 'List', todo: 'To-do', quote: 'Quote', callout: 'Callout', code: 'Code' };
const LISTY = new Set(['ul', 'ol', 'todo']);
function drawBlocks() {
  const p = page(); let n = 0;
  $('#blocks').replaceChildren(...p.blocks.map((b, i) => {
    n = b.type === 'ol' ? n + 1 : 0;
    return blockEl(b, i, n);
  }));
  drawMeta();
}
function blockEl(b, i, num) {

    h('button', { title: 'Add a block below', 'aria-label': 'Add block', onclick: () => { page().blocks.splice(i + 1, 0, B('p')); drawBlocks(); focusBlock(i + 1); } }, '+'),

const blockAt = (el) => { const w = el.closest?.('.block'); return w ? { w, i: +w.dataset.i, b: page().blocks[+w.dataset.i], c: $('.c', w) } : null; };

/* ---------- editing ---------- */
const SHORTCUTS = [[/^#\s/, 'h1'], [/^##\s/, 'h2'], [/^###\s/, 'h3'], [/^[-*]\s/, 'ul'], [/^1[.)]\s/, 'ol'], [/^\[\s?\]\s/, 'todo'], [/^\[x\]\s/i, 'todo', true], [/^>\s/, 'quote'], [/^```\s?/, 'code'], [/^!\s/, 'callout']];
const doc = $('#doc');
doc.addEventListener('input', (e) => {

doc.addEventListener('paste', (e) => {

/* ---------- drag to reorder ---------- */
let dragFrom = null;
function wireDrag(grip, wrap, i) {
  grip.addEventListener('dragstart', (e) => { dragFrom = i; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', ''); e.dataTransfer.setDragImage(wrap, 20, 14); });
  grip.addEventListener('dragend', () => { dragFrom = null; document.querySelectorAll('.drop-above, .drop-below').forEach((x) => x.classList.remove('drop-above', 'drop-below')); });
  wrap.addEventListener('dragover', (e) => {

/* ---------- slash menu ---------- */
const COMMANDS = [
  ['p', 'Text', 'Plain paragraph', 'Aa'], ['h1', 'Heading 1', 'Big section heading', 'H1'], ['h2', 'Heading 2', 'Medium heading', 'H2'], ['h3', 'Heading 3', 'Small heading', 'H3'],
  ['todo', 'To-do list', 'Track tasks with a checkbox', '☑'], ['ul', 'Bulleted list', 'A simple list', '•'], ['ol', 'Numbered list', 'A list with numbers', '1.'],
  ['quote', 'Quote', 'Capture a quote', '❝'], ['callout', 'Callout', 'Make it stand out', '💡'], ['code', 'Code', 'Monospace, keeps spacing', '</>'],
  ['divider', 'Divider', 'Visually split blocks', '—'], ['page', 'Page', 'A sub-page inside this one', '📄'],

let slash = null;
function openSlash(at, q) {

/* ---------- quick switcher ---------- */
let qSel = 0, qList = [];
function drawQ() {
  const q = $('#qIn').value.trim().toLowerCase();

    const body = p.blocks.map((b) => textOf(b.html)).join(' ');

  }).filter((x) => x.score >= 0).sort((a, b) => b.score - a.score).slice(0, 12);

$('#qIn').addEventListener('input', () => { qSel = 0; drawQ(); });
$('#qIn').addEventListener('keydown', (e) => {

/* ---------- menu, export ---------- */
$('#menuBtn').addEventListener('click', (e) => { e.stopPropagation(); $('#menu').classList.toggle('hidden'); });

function download(name, text, type) {
  const a = h('a', { href: URL.createObjectURL(new Blob([text], { type })), download: name });

$('#mMd').addEventListener('click', () => download((page().title || 'Untitled').replace(/[\\/:*?"<>|]+/g, '') + '.md', toMarkdown(page()), 'text/markdown'));
